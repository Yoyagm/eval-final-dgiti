name: CD — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag adicional para la imagen (default = SHA corto)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ASG_NAME: eval-final-dgiti-asg

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.emit.outputs.image_uri }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Emit image URI and summary
        id: emit
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}"
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          {
            echo "## 🐳 Imagen publicada en GHCR"
            echo "- \`$IMAGE_URI\`"
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`"
            echo ""
            echo "> Si es el primer push, marca el package como **public** en"
            echo "> github.com/Yoyagm?tab=packages para que las EC2 puedan hacer pull sin login."
          } >> $GITHUB_STEP_SUMMARY

  refresh-asg:
    name: Trigger ASG instance refresh
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ASG exists
        id: check
        run: |
          set +e
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].AutoScalingGroupName' \
            --output text > /tmp/asg.txt
          if grep -q "${{ env.ASG_NAME }}" /tmp/asg.txt; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::ASG ${{ env.ASG_NAME }} aún no existe. Corre 'terraform apply' primero."
          fi

      - name: Start instance refresh
        if: steps.check.outputs.exists == 'true'
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ env.ASG_NAME }}" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}' \
            --query 'InstanceRefreshId' --output text)
          echo "Instance refresh iniciado: $REFRESH_ID"
          {
            echo "## ♻️ ASG Instance Refresh"
            echo "- ASG: \`${{ env.ASG_NAME }}\`"
            echo "- Refresh ID: \`$REFRESH_ID\`"
            echo "- Nueva imagen: \`${{ needs.build-and-push.outputs.image_uri }}\`"
          } >> $GITHUB_STEP_SUMMARY
